<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#40E0D0"/>

  <!-- Mountain silhouette -->
  <path d="M64 400 L200 180 L280 280 L360 160 L448 400 Z" fill="#1E3A5F" opacity="0.3"/>

  <!-- Climber emoji representation -->
  <g transform="translate(256, 256)">
    <!-- Body -->
    <circle cx="0" cy="-60" r="45" fill="#FFE4C4"/>
    <!-- Helmet -->
    <ellipse cx="0" cy="-90" rx="40" ry="25" fill="#FF6B6B"/>
    <!-- Arms reaching up -->
    <path d="M-30 -30 Q-60 -80 -40 -120" stroke="#FFE4C4" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M30 -30 Q60 -80 40 -120" stroke="#FFE4C4" stroke-width="20" fill="none" stroke-linecap="round"/>
    <!-- Hands gripping -->
    <circle cx="-40" cy="-120" r="15" fill="#FFE4C4"/>
    <circle cx="40" cy="-120" r="15" fill="#FFE4C4"/>
    <!-- Body/shirt -->
    <ellipse cx="0" cy="20" rx="35" ry="50" fill="#1E3A5F"/>
    <!-- Legs -->
    <path d="M-20 60 L-30 130" stroke="#FFE4C4" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M20 60 L30 130" stroke="#FFE4C4" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="-30" cy="140" rx="18" ry="12" fill="#FF6B6B"/>
    <ellipse cx="30" cy="140" rx="18" ry="12" fill="#FF6B6B"/>
  </g>

  <!-- Stars/sparkles -->
  <circle cx="100" cy="100" r="8" fill="#FFD700"/>
  <circle cx="412" cy="80" r="6" fill="#FFD700"/>
  <circle cx="80" cy="200" r="5" fill="#FFD700"/>
  <circle cx="432" cy="180" r="7" fill="#FFD700"/>
</svg>
