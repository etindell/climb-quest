<!DOCTYPE html>
<html>
<head>
  <title>Climb Quest Icon Generator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 { color: #1E3A5F; }
    .icon-preview {
      display: inline-block;
      margin: 10px;
      text-align: center;
    }
    canvas {
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
    }
    .size-label {
      display: block;
      margin-top: 5px;
      font-size: 12px;
      color: #666;
    }
    button {
      background: #40E0D0;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover { background: #2AB5A5; }
    .instructions {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1>Climb Quest Icon Generator</h1>

  <div class="instructions">
    <h3>Instructions:</h3>
    <ol>
      <li>Click "Generate All Icons" to create icons at all sizes</li>
      <li>Right-click each icon and "Save image as..." to save</li>
      <li>Save to <code>public/icons/</code> with the correct filename</li>
    </ol>
  </div>

  <button onclick="generateAllIcons()">Generate All Icons</button>
  <button onclick="downloadAll()">Download All (one by one)</button>

  <div id="icons"></div>

  <script>
    const sizes = [16, 32, 72, 96, 128, 144, 152, 180, 192, 384, 512];

    function drawIcon(ctx, size) {
      const s = size;
      const r = s * 0.15; // Corner radius

      // Background with rounded corners
      ctx.fillStyle = '#40E0D0';
      ctx.beginPath();
      ctx.roundRect(0, 0, s, s, r);
      ctx.fill();

      // Mountain
      ctx.fillStyle = 'rgba(30, 58, 95, 0.3)';
      ctx.beginPath();
      ctx.moveTo(s * 0.1, s * 0.8);
      ctx.lineTo(s * 0.35, s * 0.35);
      ctx.lineTo(s * 0.5, s * 0.55);
      ctx.lineTo(s * 0.7, s * 0.3);
      ctx.lineTo(s * 0.9, s * 0.8);
      ctx.closePath();
      ctx.fill();

      // Climber emoji (centered)
      const fontSize = s * 0.5;
      ctx.font = `${fontSize}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🧗', s / 2, s / 2);

      // Sparkle
      ctx.fillStyle = '#FFD700';
      ctx.beginPath();
      ctx.arc(s * 0.2, s * 0.2, s * 0.03, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(s * 0.85, s * 0.15, s * 0.025, 0, Math.PI * 2);
      ctx.fill();
    }

    function generateAllIcons() {
      const container = document.getElementById('icons');
      container.innerHTML = '';

      sizes.forEach(size => {
        const div = document.createElement('div');
        div.className = 'icon-preview';

        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        canvas.id = `icon-${size}`;

        const ctx = canvas.getContext('2d');
        drawIcon(ctx, size);

        const label = document.createElement('span');
        label.className = 'size-label';

        let filename = `icon-${size}x${size}.png`;
        if (size === 180) filename = 'apple-touch-icon.png';
        if (size === 32) filename = 'icon-32x32.png';
        if (size === 16) filename = 'icon-16x16.png';

        label.textContent = filename;

        div.appendChild(canvas);
        div.appendChild(label);
        container.appendChild(div);
      });
    }

    function downloadAll() {
      sizes.forEach((size, index) => {
        setTimeout(() => {
          const canvas = document.getElementById(`icon-${size}`);
          if (!canvas) return;

          const link = document.createElement('a');
          let filename = `icon-${size}x${size}.png`;
          if (size === 180) filename = 'apple-touch-icon.png';

          link.download = filename;
          link.href = canvas.toDataURL('image/png');
          link.click();
        }, index * 500);
      });
    }

    // Generate on load
    window.onload = generateAllIcons;
  </script>
</body>
</html>
